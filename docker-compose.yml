volumes:
  pg_data:

services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql
    restart: always

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file: .env
    depends_on:
      - db
    restart: on-failure
    ports:
      - 8000:8000
