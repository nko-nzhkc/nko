volumes:
  pg_data:

services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql
    restart: always
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      - 8000:8000
