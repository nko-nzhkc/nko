[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.mypy]
python_version = "3.13"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

mypy_path = "backend"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
extra_checks = true
strict_equality_for_none = true
exclude = "^backend/.*/migrations/.*$"

enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "faker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["api.tests", "api.tests.*", "pytest.*", "*.tests", "*.tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "donor_base.settings"

[tool.ruff]
target-version = "py313"
line-length = 80
preview = true
fix = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "COM",
  "D",
  "DJ",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INT",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T100",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "A005",
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D418",
  "DJ008",
  "ISC001",
  "ISC003",
  "PLC0414",
  "PLR09",
  "PLR2004",
  "PLR6301",
  "PLW2901",
  "RUF029",
  "RUF067",
  "TRY003",
]
external = [ "WPS" ]

flake8-gettext.extend-function-names = [ "_" ]
flake8-quotes.inline-quotes = "single"

isort.known-first-party = [ "server", "examples" ]
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.flake8]
format = "wemake"
show-source = true
statistics = false
doctests = true

max-complexity = 6
max-line-length = 80
max-imports = 25
max-arguments = 6

allowed-domain-names = ["data"]

select = ["WPS", "E99"]

ignore = ["WPS412"]

extend-exclude = [
    "venv",
    ".vscode/",
    "docs/",
    "*/migrations/*",
    "backend/static/",
    "media/",
]