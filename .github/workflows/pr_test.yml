name: Test Crisis-center Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          poetry install

      - name: Test with flake8
        run: |
          poetry run flake8 --exclude=*/migrations/* backend/ tests/

      - name: Test with ruff
        run: |
          poetry run ruff check backend/ tests/
          poetry run ruff format --check backend/ tests/

      - name: Check migrations
        run: |
          cp .env.example .env
          sed -i 's#^CSRF_TRUSTED_ORIGINS=.*#CSRF_TRUSTED_ORIGINS=https://localhost#' .env
          docker compose run --rm backend poetry run python manage.py makemigrations --check --dry-run

      - name: Test with pytest
        run: |
          docker compose run --rm backend sh -c "poetry install && poetry run pytest"
