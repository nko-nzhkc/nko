name: Test Crisis-center Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./backend/requirements-dev.txt
          pip install -r ./backend/requirements.txt

      - name: Test with flake8
        run: |
          python -m flake8 --exclude=*/migrations/* backend/

      - name: Check migrations
        run: |
          cp .env.example .env
          sed -i 's#^CSRF_TRUSTED_ORIGINS=.*#CSRF_TRUSTED_ORIGINS=https://localhost#' .env
          docker compose run --rm backend python manage.py makemigrations --check --dry-run

      - name: Test with pytest
        run: |
          docker compose run --rm backend sh -c "pip install -r requirements-dev.txt && pytest"
